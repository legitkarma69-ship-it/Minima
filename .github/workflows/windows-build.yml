name: Windows x64 build

on:
  push:
    branches: [master, feature/win32-ui-foundation]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Minima and Win32 GUI
        run: msbuild Minima.sln /m /p:Configuration=Release /p:Platform=x64 /p:RestoreIgnoreFailedSources=true

      - name: Verify engine CLI
        shell: pwsh
        run: |
          & ".\x64\Release\Minima.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run fresh-training smoke test
        shell: pwsh
        run: |
          & ".\x64\Release\Minima.exe" --steps 1 --vocab-size 512 --tokenizer-sample-bytes 8192 --batch-size 1 --sequence-length 8 --max-seq 32 --validation-batches 1 --log-interval 1 --validation-interval 1 --checkpoint-interval 1 --metrics ".\minima_ci_metrics.csv" ".\data\books.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path ".\minima.model") -or !(Test-Path ".\minima.bpe")) {
            throw "Fresh-training smoke test did not produce a checkpoint and tokenizer."
          }

      - name: Verify checkpoint resume diagnostics
        shell: pwsh
        run: |
          & ".\x64\Release\Minima.exe" --resume --diagnostics-only --vocab-size 512 --batch-size 1 --sequence-length 8 --max-seq 32 --validation-batches 1 --metrics ".\minima_ci_resume_metrics.csv" ".\data\books.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMinima-Windows-x64
          path: |
            x64/Release/Minima.exe
            x64/Release/MinimaGUI.exe
          if-no-files-found: error
